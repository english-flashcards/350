<html lang="ja">

<title>英語フラッシュカード 350</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 20px;
  }

  h1 {
    font-size: 1.2rem;
    color: #a0aec0;
    letter-spacing: 0.05em;
  }

  .progress-bar-wrap {
    width: 100%;
    max-width: 480px;
    background: #2d3748;
    border-radius: 99px;
    height: 6px;
  }
  .progress-bar {
    height: 6px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    border-radius: 99px;
    transition: width 0.3s ease;
  }

  .counter {
    font-size: 0.95rem;
    color: #718096;
  }

  /* --- Card --- */
  .scene {
    width: 100%;
    max-width: 480px;
    height: 260px;
    perspective: 1000px;
    cursor: pointer;
  }

  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 20px;
  }

  .card.flipped {
    transform: rotateY(180deg);
  }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    gap: 12px;
  }

  .face-front {
    background: linear-gradient(135deg, #232946 0%, #16213e 100%);
    border: 1px solid #3d4a6b;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .face-back {
    background: linear-gradient(135deg, #0f3460 0%, #162447 100%);
    border: 1px solid #2a4a7f;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    transform: rotateY(180deg);
  }

  .face-label {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.45;
  }

  .face-text {
    font-size: 1.55rem;
    font-weight: 600;
    text-align: center;
    line-height: 1.5;
    color: #f0f4ff;
  }

  .face-back .face-text {
    font-size: 1.35rem;
    color: #93c5fd;
    font-weight: 500;
    font-family: 'Georgia', serif;
    font-style: italic;
  }

  .tap-hint {
    font-size: 0.75rem;
    opacity: 0.3;
    margin-top: 4px;
  }

  /* --- Controls --- */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-prev, .btn-next {
    background: #2d3748;
    color: #e2e8f0;
    min-width: 100px;
  }
  .btn-prev:hover, .btn-next:hover {
    background: #4a5568;
    transform: translateY(-1px);
  }
  .btn-prev:disabled, .btn-next:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none;
  }

  .btn-shuffle {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
  }
  .btn-shuffle:hover {
    opacity: 0.88;
    transform: translateY(-1px);
  }

  .btn-reset {
    background: #2d3748;
    color: #a0aec0;
    font-size: 0.85rem;
  }
  .btn-reset:hover {
    background: #4a5568;
  }

  .card-num {
    font-size: 0.8rem;
    color: #553c9a;
    font-weight: 700;
    position: absolute;
    top: 16px;
    left: 20px;
  }

  .btn-speak {
    background: none;
    border: 1.5px solid rgba(147, 197, 253, 0.35);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    min-width: unset;
    padding: 0;
    font-size: 1.1rem;
    color: #93c5fd;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
    margin-top: 6px;
  }
  .btn-speak:hover { background: rgba(147,197,253,0.12); transform: scale(1.1); }
  .btn-speak.speaking { background: rgba(147,197,253,0.2); animation: pulse 0.8s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }

  @media (max-width: 540px) {
    .scene { height: 230px; }
    .face-text { font-size: 1.25rem; }
  }
</style>
</head>
<body>

<h1>英語フラッシュカード 350</h1>

<div class="progress-bar-wrap">
  <div class="progress-bar" id="progressBar"></div>
</div>

<div class="counter" id="counter">1 / 354</div>

<div class="scene" onclick="flipCard()">
  <div class="card" id="card">
    <div class="face face-front">
      <div class="card-num" id="cardNum">#1</div>
      <div class="face-label">日本語</div>
      <div class="face-text" id="frontText"></div>
      <div class="tap-hint">タップして答えを見る</div>
    </div>
    <div class="face face-back">
      <div class="face-label">English</div>
      <div class="face-text" id="backText"></div>
      <button class="btn-speak" id="btnSpeak" onclick="event.stopPropagation(); speakCurrent()">🔊</button>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn-prev" id="btnPrev" onclick="prev()">← 前へ</button>
  <button class="btn-next" id="btnNext" onclick="next()">次へ →</button>
</div>
<div class="controls">
  <button class="btn-shuffle" onclick="shuffle()">シャッフル</button>
  <button class="btn-reset" onclick="reset()">順番に戻す</button>
</div>

let order = raw.map((_, i) => i);
let current = 0;
let flipped = false;

const card = document.getElementById('card');
const frontText = document.getElementById('frontText');
const backText = document.getElementById('backText');
const cardNum = document.getElementById('cardNum');
const counter = document.getElementById('counter');
const progressBar = document.getElementById('progressBar');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');

function render() {
  const idx = order[current];
  frontText.textContent = raw[idx][0];
  backText.textContent = raw[idx][1];
  cardNum.textContent = '#' + (idx + 1);
  counter.textContent = (current + 1) + ' / ' + order.length;
  progressBar.style.width = ((current + 1) / order.length * 100) + '%';
  btnPrev.disabled = current === 0;
  btnNext.disabled = current === order.length - 1;

  // unflip
  if (flipped) {
    card.classList.remove('flipped');
    flipped = false;
  }
}

// --- Speech ---
const synth = window.speechSynthesis;
let voices = [];
const btnSpeak = document.getElementById('btnSpeak');

function loadVoices() {
  voices = synth.getVoices();
}
loadVoices();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;

function speakCurrent() {
  if (!synth) return;
  synth.cancel();
  const idx = order[current];
  const text = raw[idx][1];
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  const enVoice = voices.find(v => v.lang.startsWith('en') && !v.name.includes('Google') || v.lang === 'en-US');
  if (enVoice) utter.voice = enVoice;
  btnSpeak.classList.add('speaking');
  utter.onend = () => btnSpeak.classList.remove('speaking');
  utter.onerror = () => btnSpeak.classList.remove('speaking');
  synth.speak(utter);
}

function flipCard() {
  flipped = !flipped;
  card.classList.toggle('flipped', flipped);
  if (flipped) setTimeout(speakCurrent, 300);
  else synth.cancel();
}

function next() {
  if (current < order.length - 1) {
    current++;
    render();
  }
}

function prev() {
  if (current > 0) {
    current--;
    render();
  }
}

function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  current = 0;
  render();
}

function reset() {
  order = raw.map((_, i) => i);
  current = 0;
  render();
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prev();
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
});

render();
</script>
